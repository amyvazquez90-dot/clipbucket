; ClipBucket on PHP 8 settings
auto_prepend_file = /var/www/html/includes/php8_compat.php

memory_limit = 256M
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING

session.save_path = "/tmp"
upload_tmp_dir = "/tmp"
sys_temp_dir = "/tmp"

date.timezone = UTC
